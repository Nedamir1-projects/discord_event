services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord_bots
      POSTGRES_PASSWORD: discord_bots_local
      POSTGRES_DB: discord_bots
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U discord_bots -d discord_bots']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
